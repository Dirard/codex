name: fork-ci

# Automated checks for the fork branch. Every step is a subcommand of
# scripts/fork/ci-local.sh, so a failing step reproduces locally with the same
# command. fork-rust-release.yml calls this workflow for the release commit.
on:
  push:
    branches: [codex/fork]
  pull_request:
    branches: [codex/fork]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A called run is grouped under the caller's workflow name and the commit.
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # CI drops debuginfo: test binaries shrink several-fold (disk, cache, link
  # time). Panic locations stay; backtraces lose line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Panics keep their backtraces, but errors do not capture one: upstream tests
  # compare `anyhow::Error` Debug output, which RUST_BACKTRACE alone extends.
  RUST_LIB_BACKTRACE: "0"

jobs:
  rust-lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: ./.github/actions/fork-setup-rust
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: scripts/fork/ci-local.sh rust-fmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          shared-key: fork-ci-clippy
          cache-on-failure: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/fork' }}

      - name: Strict clippy for fork-touched crates
        run: scripts/fork/ci-local.sh rust-clippy

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  rust-test:
    name: Rust tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # Cold cache: ~40 min to build codex-core tests and helpers on 4 vCPUs,
    # then ~10 min for one third of codex-core, linux-sandbox and protocol.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: ./.github/actions/fork-setup-rust
        with:
          free-disk: "true"
          sandbox: "true"

      # The version goes in `tool` (install-action has no `version` input);
      # ci-local.sh rust-test fails in CI when it differs from nextest_version.
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103

      # Every shard builds the same binaries; only the first one saves the cache,
      # which go-runtime also reads (two cache families per Cargo.lock in all).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          shared-key: fork-ci-test
          cache-on-failure: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/fork' && matrix.shard == 1 }}

      - name: codex-core, codex-linux-sandbox, codex-app-server-protocol, codex-workflow, codex-worktree, codex-exec, codex-utils-string
        run: scripts/fork/ci-local.sh rust-test --partition "hash:${{ matrix.shard }}/3"

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fork-ci-junit-shard-${{ matrix.shard }}
          path: codex-rs/target/nextest/default/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  rust-app-server:
    name: codex-app-server tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # Cold cache: ~40 min to build the codex-app-server tests and helpers on
    # 4 vCPUs. The default nextest profile runs the integration tests one at a
    # time (test-group app_server_integration): a quarter is ~550 tests and
    # took 9 min on a 32-core workstation.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: ./.github/actions/fork-setup-rust
        with:
          free-disk: "true"
          sandbox: "true"

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103

      # Reads the rust-test cache (codex, helpers and most dependencies) and
      # never saves one: the 10 GB cache budget holds two families.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          shared-key: fork-ci-test
          save-if: "false"

      - name: codex-app-server
        run: scripts/fork/ci-local.sh rust-app-server-test --partition "hash:${{ matrix.shard }}/4"

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fork-ci-junit-app-server-shard-${{ matrix.shard }}
          path: codex-rs/target/nextest/default/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  go-sdk:
    name: Go SDK (gofmt, vet, race tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.mod

      - name: gofmt and go vet
        run: scripts/fork/ci-local.sh go-static

      - name: go test -race ./...
        run: scripts/fork/ci-local.sh go-test

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  go-runtime:
    name: Go SDK generators and real app-server
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: ./.github/actions/fork-setup-rust
        with:
          free-disk: "true"
          sandbox: "true"

      # Restores the rust-test cache (it builds codex too) and never saves one,
      # so the repository's 10 GB cache budget holds two families, not three.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          shared-key: fork-ci-test
          save-if: "false"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.mod

      - name: Build codex, codex-app-server and write_go_sdk_manifest
        run: scripts/fork/ci-local.sh go-runtime-build

      - name: Generator drift (manifest, experimental schema, protocodex)
        run: scripts/fork/ci-local.sh go-generators

      - name: TestRealAppServer* with strict handshake
        run: scripts/fork/ci-local.sh go-real-app-server

      - name: TestAuthFixture* against codex-app-server
        run: scripts/fork/ci-local.sh go-auth-fixture

      - name: Release script self-tests
        run: scripts/fork/ci-local.sh scripts

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  result:
    name: fork-ci result
    if: always()
    needs: [rust-lint, rust-test, rust-app-server, go-sdk, go-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every fork-ci job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null
