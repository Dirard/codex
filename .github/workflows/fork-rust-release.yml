name: fork-rust-release

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Git ref or commit to build
        required: true
        default: codex/fork
        type: string
      version:
        description: Release version without a prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-rust-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Validate version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          test "$actual_version" = "$EXPECTED_VERSION"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Use hermetic Cargo home
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Linux sandbox helper
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release \
            --bin codex \
            --bin codex-app-server \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Stage release binaries
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/dist/${TARGET}"
          mkdir -p "$dest"

          binaries=(codex codex-app-server codex-code-mode-host codex-responses-api-proxy)
          if [[ "$TARGET" == *linux* ]]; then
            binaries+=(bwrap)
          fi

          for binary in "${binaries[@]}"; do
            source_path="target/${TARGET}/release/${binary}"
            output_name="${binary}-${TARGET}"
            if [[ "$binary" != "bwrap" ]]; then
              if [[ "$TARGET" == *apple-darwin ]]; then
                strip -S -x "$source_path"
              else
                strip --strip-debug --strip-unneeded "$source_path"
              fi
            fi
            cp "$source_path" "$dest/$output_name"
            chmod 0755 "$dest/$output_name"
            tar -C "$dest" -czf "$dest/${output_name}.tar.gz" "$output_name"
            rm "$dest/$output_name"
          done

          (
            cd "$dest"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum ./*.tar.gz > SHA256SUMS
            else
              shasum -a 256 ./*.tar.gz > SHA256SUMS
            fi
          )

          tar -C "$dest" -xzf "$dest/codex-${TARGET}.tar.gz"
          "$dest/codex-${TARGET}" --version | grep -F "$VERSION"
          rm "$dest/codex-${TARGET}"

      - name: Upload release binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ inputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
