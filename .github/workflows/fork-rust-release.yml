name: fork-rust-release

on:
  push:
    tags:
      - "rust-v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the rust-v prefix
        required: true
        type: string
      checkout_ref:
        description: Git ref or commit to build
        required: true
        default: codex/fork
        type: string
      build_matrix:
        description: Optional JSON array of runner and target pairs
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-rust-release-${{ inputs.release_version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_matrix || '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin"},{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]') }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Resolve release version
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?$ ]]
            version="${GITHUB_REF_NAME#rust-v}"
          else
            version="${MANUAL_VERSION}"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?$ ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bwrap and export digest
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --target "${TARGET}" --release --bin bwrap

          bwrap_path="target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "${bwrap_path}"
          digest="$(sha256sum "${bwrap_path}" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "${GITHUB_ENV}"

      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binaries=(codex codex-app-server codex-code-mode-host codex-responses-api-proxy)
          if [[ "${TARGET}" == *windows* ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
            binaries+=(codex-command-runner codex-windows-sandbox-setup)
          fi
          build_args=()
          for binary in "${binaries[@]}"; do
            build_args+=(--bin "${binary}")
          done
          cargo build --target "${TARGET}" --release "${build_args[@]}"

      - name: Package runtime
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/dist/${TARGET}"
          stage_dir="${RUNNER_TEMP}/fork-release-${TARGET}"
          rm -rf "${stage_dir}"
          mkdir -p "${dest}" "${stage_dir}/bin"

          binaries=(codex codex-app-server codex-code-mode-host codex-responses-api-proxy)
          if [[ "${TARGET}" == *linux* ]]; then
            binaries+=(bwrap)
          elif [[ "${TARGET}" == *windows* ]]; then
            binaries+=(codex-command-runner codex-windows-sandbox-setup)
          fi

          extension=""
          if [[ "${TARGET}" == *windows* ]]; then
            extension=".exe"
          fi

          expected_entries=()
          for binary in "${binaries[@]}"; do
            cp "target/${TARGET}/release/${binary}${extension}" "${stage_dir}/bin/${binary}${extension}"
            expected_entries+=("bin/${binary}${extension}")
            if [[ "${TARGET}" == *apple-darwin ]]; then
              strip -S -x "${stage_dir}/bin/${binary}"
            elif [[ "${TARGET}" != *windows* && "${binary}" != "bwrap" ]]; then
              strip --strip-debug --strip-unneeded "${stage_dir}/bin/${binary}"
            fi
          done

          if [[ "${TARGET}" == *windows* ]]; then
            archive="${dest}/codex-package-${TARGET}.zip"
            (cd "${stage_dir}" && 7z a -tzip "${archive}" bin)
            actual_entries="$(
              7z l -ba "${archive}" |
                awk '{print $NF}' |
                sed 's#\\#/#g' |
                sed -E '/^bin\/?$/d' |
                sort
            )"
          else
            archive="${dest}/codex-package-${TARGET}.tar.gz"
            tar -C "${stage_dir}" -czf "${archive}" bin
            actual_entries="$(tar -tzf "${archive}" | sed -E '/^bin\/?$/d' | sort)"
          fi

          expected_listing="$(printf '%s\n' "${expected_entries[@]}" | sort)"
          test "${actual_entries}" = "${expected_listing}"
          "${stage_dir}/bin/codex${extension}" --version | grep -F "${VERSION}"

      - name: Upload release binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ steps.release.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
