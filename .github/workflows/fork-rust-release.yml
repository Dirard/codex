name: fork-rust-release

# Builds the fork runtime packages for one exact commit, verifies them, runs
# fork-ci on the same commit, and stages a draft GitHub release. Tags and
# publication stay manual: the draft job summary lists the commands.
#
# Dispatch from codex/fork; the commit must be on codex/fork and carry the same
# workflows and scripts as its tip (scripts/fork/release.sh machinery):
#   gh workflow run fork-rust-release.yml --ref codex/fork \
#     -f release_version=X.Y.Z -f checkout_ref=<full SHA>
# Re-running a failed draft job replaces the partial draft it left.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the rust-v prefix (must match codex-rs/Cargo.toml)
        required: true
        type: string
      checkout_ref:
        description: Full 40-character commit SHA to build
        required: true
        type: string
      build_matrix:
        description: Optional JSON array of runner and target pairs (a partial matrix never creates a draft)
        required: false
        type: string
      create_draft:
        description: Create a draft release after the packages pass verification
        required: false
        default: true
        type: boolean
      require_ci:
        description: Create the draft only when fork-ci passes for the commit
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-rust-release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      sha: ${{ steps.validate.outputs.sha }}
      matrix: ${{ steps.validate.outputs.matrix }}
      targets: ${{ steps.validate.outputs.targets }}
      full_matrix: ${{ steps.validate.outputs.full_matrix }}
    steps:
      - name: Require a full commit SHA and a codex/fork dispatch
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "${CHECKOUT_REF}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::checkout_ref must be a full 40-character lowercase commit SHA"
            exit 1
          }
          [[ "${DISPATCH_REF}" == refs/heads/codex/fork ]] || {
            echo "::error::dispatch fork-rust-release from codex/fork (gh workflow run fork-rust-release.yml --ref codex/fork ...), not ${DISPATCH_REF}"
            exit 1
          }

      # Trusted code first: the dispatched codex/fork commit checks where the
      # release commit comes from before any code of that commit runs.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the release commit on codex/fork with this workflow's machinery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.checkout_ref }}
          DISPATCHED: ${{ github.sha }}
        run: scripts/fork/release.sh provenance --repo "${REPO}" --sha "${SHA}" --base "${DISPATCHED}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Validate version, commit, matrix, tags and releases
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          SHA: ${{ inputs.checkout_ref }}
          BUILD_MATRIX: ${{ inputs.build_matrix }}
          REPO: ${{ github.repository }}
        run: |
          scripts/fork/release.sh preflight --repo "${REPO}" --version "${VERSION}" \
            --sha "${SHA}" --matrix "${BUILD_MATRIX}" --output "${GITHUB_OUTPUT}"

  # Drafts are visible only to a token with push access, so this job holds
  # contents: write; it only reads releases. It always runs (its steps are
  # conditional) so that build never turns skipped through a skipped need.
  draft-precheck:
    name: Check existing releases for the draft
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: No draft will be created
        if: ${{ !(inputs.create_draft && needs.preflight.outputs.full_matrix == 'true') }}
        run: echo "create_draft is false or the matrix is partial; existing drafts are not checked"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.create_draft && needs.preflight.outputs.full_matrix == 'true'
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/fork

      - name: Fail early on a published release or a draft that is not resumable
        if: inputs.create_draft && needs.preflight.outputs.full_matrix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: scripts/fork/release.sh draft-check --repo "${REPO}" --version "${VERSION}" --sha "${SHA}"

  build:
    name: Build ${{ matrix.target }}
    needs: [preflight, draft-precheck]
    runs-on: ${{ matrix.runner }}
    # macOS arm64 took 201 minutes for 0.164.0; hosted jobs stop at 360.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/fork-rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bwrap and export digest
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --locked --target "${TARGET}" --release --bin bwrap

          bwrap_path="target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "${bwrap_path}"
          digest="$(sha256sum "${bwrap_path}" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "${GITHUB_ENV}"

      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binaries=(codex codex-app-server codex-code-mode-host codex-responses-api-proxy)
          if [[ "${TARGET}" == *windows* ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
            binaries+=(codex-command-runner codex-windows-sandbox-setup)
          fi
          build_args=()
          for binary in "${binaries[@]}"; do
            build_args+=(--bin "${binary}")
          done
          cargo build --locked --target "${TARGET}" --release "${build_args[@]}"

      - name: Package runtime
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/dist/${TARGET}"
          stage_dir="${RUNNER_TEMP}/fork-release-${TARGET}"
          rm -rf "${stage_dir}"
          mkdir -p "${dest}" "${stage_dir}/bin"

          binaries=(codex codex-app-server codex-code-mode-host codex-responses-api-proxy)
          if [[ "${TARGET}" == *linux* ]]; then
            binaries+=(bwrap)
          elif [[ "${TARGET}" == *windows* ]]; then
            binaries+=(codex-command-runner codex-windows-sandbox-setup)
          fi

          extension=""
          if [[ "${TARGET}" == *windows* ]]; then
            extension=".exe"
          fi

          expected_entries=()
          for binary in "${binaries[@]}"; do
            cp "target/${TARGET}/release/${binary}${extension}" "${stage_dir}/bin/${binary}${extension}"
            expected_entries+=("bin/${binary}${extension}")
            if [[ "${TARGET}" == *apple-darwin ]]; then
              strip -S -x "${stage_dir}/bin/${binary}"
            elif [[ "${TARGET}" != *windows* && "${binary}" != "bwrap" ]]; then
              strip --strip-debug --strip-unneeded "${stage_dir}/bin/${binary}"
            fi
          done

          if [[ "${TARGET}" == *windows* ]]; then
            archive="${dest}/codex-package-${TARGET}.zip"
            (cd "${stage_dir}" && 7z a -tzip "${archive}" bin)
            actual_entries="$(
              7z l -ba "${archive}" |
                awk '{print $NF}' |
                sed 's#\\#/#g' |
                sed -E '/^bin\/?$/d' |
                sort
            )"
          else
            archive="${dest}/codex-package-${TARGET}.tar.gz"
            tar -C "${stage_dir}" -czf "${archive}" bin
            actual_entries="$(tar -tzf "${archive}" | sed -E '/^bin\/?$/d' | sort)"
          fi

          expected_listing="$(printf '%s\n' "${expected_entries[@]}" | sort)"
          test "${actual_entries}" = "${expected_listing}"
          test "$("${stage_dir}/bin/codex${extension}" --version)" = "codex-cli ${VERSION}"

      - name: Upload release binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ needs.preflight.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  ci:
    name: fork-ci
    needs: [preflight, draft-precheck]
    uses: ./.github/workflows/fork-ci.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  verify:
    name: Verify packages
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.mod

      # Package artifacts are codex-<version>-<target>; every target contains a
      # hyphen, so the pattern skips codex-<version>-SHA256SUMS.
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-${{ needs.preflight.outputs.version }}-*-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Verify layout, modes, architectures, version and strict handshake
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGETS: ${{ needs.preflight.outputs.targets }}
          DIST: ${{ runner.temp }}/dist
        run: scripts/fork/verify-release.sh --version "${VERSION}" --dist "${DIST}" --targets "${TARGETS}"

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ needs.preflight.outputs.version }}-SHA256SUMS
          path: ${{ runner.temp }}/dist/SHA256SUMS
          if-no-files-found: error

  # !cancelled(), not always(): a cancelled run must not start or keep a draft
  # job. A failed ci still reaches this condition when require_ci is false.
  draft:
    name: Create draft release
    needs: [preflight, verify, ci]
    if: >-
      !cancelled()
      && inputs.create_draft
      && needs.preflight.outputs.full_matrix == 'true'
      && needs.verify.result == 'success'
      && (needs.ci.result == 'success' || !inputs.require_ci)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Download verified packages and SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-${{ needs.preflight.outputs.version }}-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Stage the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
          DIST: ${{ runner.temp }}/dist
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/fork/release.sh draft --repo "${REPO}" --version "${VERSION}" \
            --sha "${SHA}" --dist "${DIST}" --run-url "${RUN_URL}"
